&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const connectorGlobals = {};
  if (mockElement != null) {
    const values = new Map(Object.entries(parse(mockElement.textContent)));
    mockElement.remove();
    connectorGlobals.visualizationData = {
      updates: Array.from(values, ([name, value]) =&gt; ({
        name,
        revision: 1,
        state: &quot;ready&quot;,
        value: { type: &quot;json&quot;, value },
      })),
    };
    connectorGlobals.visualization = {
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {
          // oxlint-disable-next-line no-console -- Keep authored callback failures local.
          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current fixture once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;style&gt;
@scope (#shifu-miniapp) {

  :scope{
    --bg:#F4F7FA; --card:#FFFFFF; --ink:#22303F; --muted:#6B7A8C;
    --blue:#2F99F1; --blue-deep:#1E7FD3; --pink:#D799A5;

  }
  *{box-sizing:border-box; margin:0}
  :scope{
    color:var(--ink);
    font-family:&#x27;Nunito&#x27;,&#x27;Segoe UI&#x27;,system-ui,sans-serif;
    font-size:15px; line-height:1.45;
  }
  .phone{width:100%; max-width:420px; margin:0 auto; background:var(--card);
    border-radius:22px; overflow:hidden; border:1px solid var(--line);
    position:relative; display:flex; flex-direction:column; height:650px}
  .preview-tools{max-width:420px; margin:0 auto 10px; display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
  .preview-tools p{color:var(--muted); font-size:13px;}
  .preview-tools button{font:inherit; color:var(--blue-deep); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:4px 10px;}
  .preview-tools button:hover{background:var(--bg);}
  @media (max-width:380px){.phone{height:620px}}
  /* ── шапка ── */
  .appbar{display:flex; align-items:center; gap:10px; padding:14px 16px 10px; background:var(--card); border-bottom:1px solid var(--line)}
  .appbar .stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:14px;
    background:none; border:0; font-family:inherit; cursor:pointer; padding:2px 4px}
  .appbar .stat.streak{color:#F08A2C}
  .appbar .stat.hf{color:var(--blue-deep)}
  .appbar .stat.qi{color:#E8A13C; font-variant-numeric:tabular-nums}
  .qi-bar{height:10px; background:var(--locked); border-radius:99px; overflow:hidden; margin:10px 0 4px}
  .qi-bar .fill{height:100%; background:linear-gradient(90deg,#F5B942,#F08A2C); border-radius:99px; transition:width .3s}
  .energy-opt{display:flex; align-items:center; gap:10px; width:100%; border:1.5px solid var(--line); background:var(--card);
    border-radius:14px; padding:12px 14px; font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:10px; text-align:left}
  .energy-opt b{margin-left:auto; color:var(--blue-deep); white-space:nowrap}
  .energy-opt.static{cursor:default; background:#F8FBFE}
  .week{display:flex; gap:8px; margin:12px 0 4px}
  .week .day{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:var(--muted)}
  .week .dot{width:26px; height:26px; border-radius:50%; background:var(--locked); display:flex; align-items:center; justify-content:center; font-size:13px}
  .week .dot.on{background:#FDEBD8; color:#F08A2C}
  /* недельная полоса = свёрнутый календарь; шеврон разворачивает месяц на её месте */
  .cal-toggle{display:flex; align-items:center; justify-content:center; width:100%; border:0; background:none;
    padding:4px 0 6px; cursor:pointer; color:#A9B7C6}
  .cal-toggle svg{transition:transform .25s}
  #streak-cal.open .cal-toggle svg{transform:rotate(180deg)}
  #streak-cal .month{display:none}
  #streak-cal.open .month{display:block}
  #streak-cal.open .week{display:none}
  .month .m-title{text-align:center; font-size:12.5px; font-weight:800; color:var(--muted); margin:10px 0 8px; letter-spacing:.03em}
  .month .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .month .wd{text-align:center; font-size:10px; font-weight:800; color:#A9B7C6}
  .mcell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%;
    font-size:12px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums}
  .mcell.fire{background:#FDEBD8; color:#F08A2C}
  .mcell.frz{background:#E3F1FD; color:var(--blue-deep)}
  .mcell.today{box-shadow:0 0 0 2px var(--blue) inset}
  .mcell.future{color:#C9D4DF}
  .balance{font-size:24px; font-weight:800; color:var(--blue-deep); margin:6px 0 2px}

  /* ── вкладка «Задание» ── */
  .q-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px}
  .q-head h2{font-size:18px}
  .q-timer{font-size:12px; font-weight:800; color:var(--muted); background:var(--card); border:1px solid var(--line);

  .q-sub{color:var(--muted); font-size:13px; margin-bottom:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:6px 14px; box-shadow:var(--shadow); margin-bottom:14px}
  .quest{display:flex; gap:12px; align-items:center; width:100%; padding:13px 0; border:0; background:none;
    font:inherit; text-align:left; cursor:pointer; border-bottom:1px solid var(--line)}
  .quest:last-child{border-bottom:0}
  .quest .q-ico{width:42px; height:42px; border-radius:12px; background:#EAF4FE; display:flex; align-items:center;
    justify-content:center; font-size:20px; flex:none}
  .quest.done .q-ico{background:#EAF9F1}
  .quest .q-body{flex:1; min-width:0}
  .quest .q-title{font-weight:800; font-size:14.5px}
  .quest.done .q-title{color:var(--muted); text-decoration:line-through}
  .q-track{height:7px; background:var(--locked); border-radius:99px; overflow:hidden; margin-top:7px}
  .q-fill{height:100%; background:var(--blue); border-radius:99px}
  .quest.done .q-fill{background:var(--done)}
  .q-meta{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none}
  .q-xp{font-weight:800; color:var(--blue-deep); font-size:13px; white-space:nowrap}
  .q-count{font-size:11.5px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
  .pd{display:flex; align-items:center; gap:12px; padding:13px 0}
  .pd .pd-star{font-size:30px}
  .pd b{font-size:14.5px}
  .pd p{color:var(--muted); font-size:12.5px}

  /* ── вкладка 汉分 ── */
  .balance-hero{text-align:center; padding:0 0 2px}
  .balance-hero .num{font-size:36px; font-weight:800; color:var(--blue-deep); font-variant-numeric:tabular-nums}
  .balance-hero p{color:var(--muted); font-size:12.5px; font-weight:700}
  .card h3{font-size:14px; margin:10px 0 2px}
  .weekbars{display:flex; gap:8px; align-items:flex-end; height:86px; padding:10px 4px 6px}
  .weekbars .wb{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end}
  .wb i{width:100%; background:linear-gradient(180deg,#6FC0FF,var(--blue)); border-radius:6px 6px 2px 2px; min-height:3px}
  .wb.frz i{background:#CFE6FB}
  .wb span{font-size:10px; color:var(--muted); font-weight:800}
  .hist{display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .h-ico{width:34px; height:34px; border-radius:10px; background:#F3F8FD; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none}
  .hist .h-t{flex:1; min-width:0; font-weight:700; font-size:13.5px}
  .hist .h-sub{display:block; color:var(--muted); font-size:11.5px; font-weight:600}
  .hist .h-xp{font-weight:800; font-size:13px; color:var(--done); font-variant-numeric:tabular-nums}
  .hist .h-xp.neg{color:#B4383E}

  /* ── вкладка Профиль ── */
  .prof-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
  .prof-ava{width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--pink),#E7B9C4);
    color:#fff; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; flex:none}
  .prof-head b{font-size:17px}
  .chip{display:inline-block; background:#EAF4FE; color:var(--blue-deep); font-size:11.5px; font-weight:800; border-radius:99px; padding:3px 10px; margin-top:3px}
  .metrics{display:flex; gap:8px; margin-bottom:14px}
  .metric{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 4px; text-align:center}
  .metric b{display:block; font-size:16px; font-variant-numeric:tabular-nums}
  .metric span{font-size:10.5px; color:var(--muted); font-weight:700}
  .badges{display:flex; gap:12px; padding:10px 0 12px}
  .badge{width:56px; text-align:center; font-size:26px; border:0; background:none; font-family:inherit; cursor:pointer; padding:0}
  .badge span{display:block; font-size:9.5px; color:var(--muted); font-weight:700; margin-top:3px}
  .badge.off{opacity:.35}
  .sub-pill{display:flex; align-items:center; gap:8px; background:#FDF2E3; color:#9A6A1B; font-weight:800; font-size:13px; border-radius:12px; padding:10px 12px; margin:10px 0 4px}
  .sub-pill .arrow{margin-left:auto; font-weight:800}
  .sub-cancel{width:100%; border:0; background:none; color:#B4383E; font:inherit; font-weight:700; font-size:13px; padding:8px 0 4px; cursor:pointer}

  /* ── фото профиля: загрузка + ракурс/масштаб, хранится статично ── */
  button.prof-ava{border:0; cursor:pointer; position:relative; font-family:inherit; overflow:visible}
  .ava-clip{position:absolute; inset:0; border-radius:50%; overflow:hidden}
  .ava-clip img{position:absolute; left:50%; top:50%; max-width:none; will-change:transform}
  .ava-cam{position:absolute; right:-3px; bottom:-3px; width:22px; height:22px; border-radius:50%;
    background:var(--card); border:1px solid var(--line); font-size:11px; display:flex; align-items:center;
    justify-content:center; box-shadow:var(--shadow)}
  .ava-edit{width:220px; height:220px; border-radius:50%; overflow:hidden; margin:14px auto 6px; background:#EAF0F6;
    position:relative; touch-action:none; cursor:grab; box-shadow:0 0 0 3px var(--line)}

  .pw-hero2::before{content:&#x27;&#x27;; position:absolute; inset:0;
    background:linear-gradient(100deg,rgba(38,86,148,.55) 0%,rgba(38,86,148,.22) 42%,rgba(38,86,148,0) 62%)}
  .pw-close{position:relative; z-index:2; width:34px; height:34px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(255,255,255,.4); color:#fff; font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .pw-h1{position:relative; z-index:2; margin-top:6px; font-size:24px; line-height:1.12; font-weight:800; max-width:58%; text-shadow:0 2px 10px rgba(23,62,110,.55); text-wrap:balance}
  .pw-sub{position:relative; z-index:2; font-size:12.5px; font-weight:700; margin-top:6px; max-width:54%; text-shadow:0 1px 8px rgba(23,62,110,.5)}
  .pw-feat-card{position:relative; z-index:3; background:var(--card); border-radius:18px; margin:-38px 14px 0;
    box-shadow:0 8px 24px rgba(34,48,63,.10); padding:11px 4px; display:grid; grid-template-columns:repeat(4,1fr)}
  .feat2{padding:0 9px; border-left:1px solid var(--line)}
  .feat2:first-child{border-left:0}
  .feat2 .f-ic{width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:6px}
  .feat2 .f-ic svg{width:18px; height:18px}
  .feat2 b{font-size:11px; display:block; line-height:1.3}
  .feat2 p{font-size:9.5px; color:var(--muted); margin-top:3px; line-height:1.35}
  .pw-body{padding:10px 16px 18px}
  .pw-body h2{font-size:17px; font-weight:800; color:var(--ink)}
  .pw-hand{display:flex; flex-direction:column; align-items:flex-end; margin:-26px 4px 0 0;
    font-family:&#x27;Caveat&#x27;,&#x27;Comic Sans MS&#x27;,cursive; font-size:16px; line-height:1.0; font-weight:700;
    color:#4A78C9; text-align:right; transform:rotate(-2deg)}
  .pw-hand svg{margin:0 12px 0 0; height:16px}
  .plan2{position:relative; display:block; width:100%; text-align:left; background:var(--card); border:2px solid var(--line);
    border-radius:18px; padding:12px 14px; margin-top:16px; font:inherit; cursor:pointer}
  .plan2.sel{border-color:var(--blue); background:#F4F9FF; box-shadow:0 6px 18px rgba(47,153,241,.16)}
  .badge-top{position:absolute; top:-12px; left:14px; background:var(--blue); color:#fff; border-radius:99px; padding:4px 12px; font-size:11.5px; font-weight:800; display:flex; align-items:center; gap:6px}
  .badge-top svg{width:13px; height:13px; fill:#fff}
  .bill-toggle{display:flex; background:#E3ECF5; border-radius:99px; padding:4px; margin-top:4px}
  .bill-toggle button{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:99px;
    padding:9px 6px; font:inherit; font-weight:800; font-size:13px; color:var(--muted); background:none; cursor:pointer}
  .bill-toggle button.on{background:var(--card); color:var(--blue-deep); box-shadow:var(--shadow)}
  .bt-badge{background:#E8F8EE; color:#1F7A4C; border-radius:99px; padding:2px 7px; font-size:10.5px; font-weight:800}
  .p2-now{font-size:16px; font-weight:800; color:var(--ink)}
  .radio{position:absolute; right:14px; top:15px; width:26px; height:26px; border-radius:50%; border:2px solid var(--line); background:var(--card)}
  .plan2.sel .radio{background:var(--blue); border-color:var(--blue)}
  .plan2.sel .radio::after{content:&#x27;✓&#x27;; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; height:100%}
  .p2-title{font-size:17px; font-weight:800}
  .p2-row{display:flex; gap:8px; align-items:center; margin-top:5px; flex-wrap:wrap}
  .p2-permo{font-size:12.5px; color:var(--muted); font-weight:700}
  .badge-save{background:#E8F8EE; color:#1F7A4C; font-size:11px; font-weight:800; border-radius:99px; padding:3px 9px; white-space:nowrap}
  .p2-price{font-size:24px; font-weight:800; margin-top:7px; font-variant-numeric:tabular-nums}
  .p2-old{color:#A9B7C6; text-decoration:line-through; font-size:13px; font-weight:700; margin-left:8px}
  .p2-per{display:block; font-size:11.5px; color:var(--muted); font-weight:700; margin-top:1px}
  .p2-priceside{position:absolute; right:52px; top:18px; text-align:right}
  .p2-priceside .p2-price{margin-top:0; font-size:20px}
  .pw-cta{width:100%; border:0; border-radius:99px; padding:14px; margin-top:12px; font:inherit; font-weight:800; font-size:16.5px;
    color:#fff; background:linear-gradient(90deg,#2F99F1,#1E7FD3); box-shadow:0 8px 20px rgba(47,153,241,.35); cursor:pointer}
  .pw-cta:disabled{opacity:.45; box-shadow:none; cursor:default}
  .pw-total{text-align:center; font-size:13px; font-weight:800; margin-top:10px}
  .pw-after{background:#E7F1FC; border-radius:16px; padding:14px; margin-top:18px}
  .pw-after .pa-head{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13.5px; margin-bottom:10px}
  .pw-after .pa-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 12px}
  .pw-after .pa-item{display:flex; gap:7px; font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.35}
  .pw-after .pa-item i{color:var(--blue-deep); font-style:normal; font-weight:800}
  .pw-after .pa-foot{text-align:center; color:var(--muted); font-size:11px; font-weight:700; margin-top:12px}
  .agree{display:flex; gap:10px; align-items:flex-start; margin-top:10px; font-size:12px; color:var(--ink); font-weight:600; cursor:pointer; line-height:1.45}
  .agree input{width:19px; height:19px; accent-color:var(--blue); flex:none; margin-top:1px; cursor:pointer}
  .agree .lnk{color:var(--blue-deep)}
  .pw-fine{font-size:11px; color:#8FA1B3; margin-top:6px; line-height:1.55}
  .pw-links{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--blue-deep); font-weight:700}
  .appbar .spacer{flex:1}
  .dict-btn{border:1px solid var(--line); background:var(--card); border-radius:10px; padding:5px 10px; font:inherit; font-weight:700; color:var(--muted); cursor:pointer}

  .scroll{flex:1; min-height:0; overflow-y:auto; padding:16px 16px 48px;
    background:linear-gradient(180deg,#E8F3FD 0%,#FDFEFF 30%,#FDF4F7 78%,#F4F9FE 100%)}

  /* ── сцена пути: шань-шуй ── */
  .scene{position:relative}
  .deco{position:absolute; z-index:0; pointer-events:none}
  .trail{position:absolute; inset:0; z-index:0; pointer-events:none}
  .path{position:relative; z-index:1}
  .node-wrap{position:relative; z-index:1}

  /* ── приветствие + CTA ── */
  .greet{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px}
  .avatar{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--blue),#7CC1F7);
    color:#fff; font-weight:800; font-size:19px; display:flex; align-items:center; justify-content:center; flex:none}
  .greet b{font-size:16px}
  .greet p{color:var(--muted); font-size:13.5px}
  .cta{width:100%; border:0; border-radius:14px; padding:13px 16px; font:inherit; font-weight:800; font-size:15.5px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px}
  .cta.primary{background:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(47,153,241,.35)}
  .cta.primary:active{transform:translateY(1px)}
  .cta.ghost{background:var(--card); color:var(--blue-deep); border:1.5px solid var(--line); margin-top:8px; font-weight:700}
  .cta-sub{font-size:12px; font-weight:600; opacity:.85}

  /* ── покрытие уровня ── */
  .cov{margin:16px 0 4px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
  .cov h4{font-size:13px; display:flex; justify-content:space-between}
  .cov h4 span{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums}
  .cov .track{height:8px; background:var(--locked); border-radius:99px; margin-top:8px; overflow:hidden}
  .cov .fill{height:100%; width:31%; background:linear-gradient(90deg,var(--blue),#6FC0FF); border-radius:99px}

  /* ── путь ── */
  .section-head{margin:20px 0 4px; text-align:center}
  .section-head .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800}
  .section-head h3{font-size:15px}
  .module-chip{margin:14px auto 6px; width:fit-content; background:#EAF4FE; color:var(--blue-deep);
    font-size:12px; font-weight:800; padding:4px 12px; border-radius:99px}
  .module-chip.next{background:var(--bg); color:var(--muted)}

  .path{display:flex; flex-direction:column; align-items:center; gap:14px; padding:8px 0 4px}
  .node-wrap{display:flex; flex-direction:column; align-items:center; gap:3px; transition:transform .2s}
  .node{width:62px; height:58px; border-radius:50% / 46%; border:0; cursor:pointer; font-size:23px;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 4px 0 rgba(34,48,63,.13); transition:transform .12s}
  .node:active{transform:translateY(2px)}
  .node.done{background:var(--done); box-shadow:0 4px 0 #2E9A62}
  .node.current{background:var(--blue); box-shadow:0 4px 0 var(--blue-deep); animation:pulse 2s infinite}
  .node.locked{background:var(--locked); box-shadow:0 4px 0 #CBD5E1; color:#9AA9B8; cursor:default}
  .node.checkpoint{border-radius:16px; width:66px}
  .node.checkpoint.locked{background:#EFE7D2; box-shadow:0 4px 0 #D9CBA6}
  .node .tick{position:absolute; right:-3px; top:-3px; width:20px; height:20px; border-radius:50%;
    background:#fff; color:var(--done); font-size:12px; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); font-weight:800}
  .node-label{font-size:11.5px; font-weight:800; color:var(--muted)}
  .node-wrap.current .node-label{color:var(--blue-deep)}
  .start-bubble{background:var(--card); border:1.5px solid var(--line); border-radius:12px; font-size:12px;
    font-weight:800; color:var(--blue-deep); padding:4px 10px; margin-bottom:-6px; box-shadow:var(--shadow); animation:bob 1.6s infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes pulse{0%,100%{box-shadow:0 4px 0 var(--blue-deep),0 0 0 0 rgba(47,153,241,.35)}
    50%{box-shadow:0 4px 0 var(--blue-deep),0 0 0 9px rgba(47,153,241,0)}}
  @media (prefers-reduced-motion:reduce){ .node.current,.start-bubble{animation:none} }

  /* ── таб-бар ── */
  /* таб-бар как в проде (TabBar.tsx): только минимал-иконки + точка-индикатор, без подписей;
     汉分 — сам иероглиф 汉, не пиктограмма */
  /* таб-бар — В ПОТОКЕ flex-колонки (не absolute): контент физически не может заехать под меню */
  .tabbar{flex:none; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:10px 6px calc(12px + env(safe-area-inset-bottom))}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:#A9B7C6;
    background:none; border:0; font-family:inherit; cursor:pointer}
  .tab svg{width:24px; height:24px}
  .tab .tabhan{font-size:20px; font-weight:800; line-height:24px}
  .tab .dot{width:4px; height:4px; border-radius:50%; background:transparent}
  .tab.active{color:var(--blue-deep)}
  .tab.active .dot{background:var(--blue-deep)}

  /* ── оверлеи ── */
  .overlay{position:absolute; inset:0; background:var(--card); display:none; flex-direction:column; z-index:20}
  .overlay.open{display:flex}
  .ov-head{display:flex; align-items:center; gap:12px; padding:18px 20px 12px}
  .ov-close{border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:2px 6px}
  .back-btn{border:0; background:none; font:inherit; font-weight:800; font-size:15px; color:var(--blue-deep); cursor:pointer; padding:4px 10px 4px 0; margin-left:2px}
  .progress{flex:1; height:10px; background:var(--locked); border-radius:99px; overflow:hidden}
  .progress .fill{height:100%; width:0%; background:var(--done); border-radius:99px; transition:width .3s}
  .ov-body{flex:1; overflow-y:auto; padding:10px 20px 16px; display:flex; flex-direction:column}
  .ex-kind{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:6px}
  .ex-prompt{font-size:19px; font-weight:800; margin-bottom:4px; text-wrap:balance}
  .ex-zh{font-size:30px; font-weight:800; letter-spacing:.02em}
  .ex-py{color:var(--muted); font-size:14px; margin-bottom:6px}

  .speak-btn{display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:#F6FAFE;
    color:var(--blue-deep); border-radius:12px; padding:8px 14px; font:inherit; font-weight:800; cursor:pointer; width:fit-content; margin:6px 0 12px}
  .speak-btn .bars{display:inline-flex; gap:2px; align-items:flex-end; height:14px}
  .speak-btn .bars i{width:3px; background:var(--blue); border-radius:2px; height:5px}
  .speak-btn.playing .bars i{animation:eq .5s infinite alternate}
  .speak-btn .bars i:nth-child(2){animation-delay:.12s} .speak-btn .bars i:nth-child(3){animation-delay:.24s} .speak-btn .bars i:nth-child(4){animation-delay:.06s}
  @keyframes eq{from{height:4px}to{height:14px}}

  .opts{display:flex; flex-direction:column; gap:10px; margin-top:8px}
  .opt{border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:12px 14px; font:inherit;
    font-weight:700; font-size:16px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center}
  .opt small{color:var(--muted); font-weight:600}
  .opt.sel{border-color:var(--blue); background:#EAF4FE}
  .opt.right{border-color:var(--done); background:#EAF9F1}
  .opt.wrong{border-color:#E2646A; background:#FDEEEF}

  .tiles,.answer-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .answer-row{min-height:52px; border-bottom:2px solid var(--line); padding-bottom:8px; align-content:flex-start}
  .tile{border:1.5px solid var(--line); border-bottom-width:3px; background:var(--card); border-radius:12px;
    padding:9px 13px; font:inherit; font-weight:800; font-size:18px; cursor:pointer}
  .tile:disabled{opacity:.25; cursor:default}
  .answer-row .tile{background:#F6FAFE; border-color:#CFE6FB}

  .pairs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
  .pair{border:1.5px solid var(--line); border-bottom-width:3px; background:var(--card); border-radius:12px;
    padding:13px 8px; font:inherit; font-weight:800; font-size:17px; cursor:pointer; position:relative}
  .pair.zh{font-size:19px}
  .pair.sel{border-color:var(--blue); background:#EAF4FE}
  .pair.gone{opacity:.18; cursor:default; border-color:var(--line)}
  .pair.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .timer{font-variant-numeric:tabular-nums; font-weight:800; color:#F08A2C; font-size:15px}

  .verdict{margin-top:auto; padding:14px; border-radius:16px; display:none; align-items:center; gap:10px}
  .verdict.show{display:flex}
  .verdict.ok{background:#EAF9F1; color:#1F7A4C}
  .verdict.bad{background:#FDEEEF; color:#B4383E}
  .verdict b{font-size:16px}
  .verdict .replay-audio{margin-left:auto; border:0; background:none; font-size:20px; cursor:pointer}
  .check{margin-top:12px}
  .check:disabled{opacity:.4; box-shadow:none}

  /* ── онбординг ── */
  .ob-body{flex:1; overflow-y:auto; padding:18px 20px 24px; display:flex; flex-direction:column}
  .ob-hero{margin:auto 0; text-align:center}
  .ob-ava{width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,var(--blue),#7CC1F7);
    color:#fff; font-size:44px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 16px}
  .ob-title{font-size:22px; font-weight:800; text-align:center; text-wrap:balance}
  .ob-sub{color:var(--muted); font-size:13.5px; text-align:center; margin-top:8px; text-wrap:balance}
  .ob-q{font-size:19px; font-weight:800; margin:6px 0 4px; text-wrap:balance}
  .ob-hint{color:var(--muted); font-size:12.5px; margin-bottom:10px}
  .opt .oi{font-size:20px; margin-right:10px}
  .ob-steps{display:flex; flex-direction:column; gap:14px; margin:auto 0; padding:0 6px}
  .ob-step{display:flex; align-items:center; gap:12px; font-weight:700; font-size:14.5px; color:var(--muted)}
  .ob-step.done{color:var(--ink)}
  .ob-step .mark{width:22px; height:22px; flex:none; display:flex; align-items:center; justify-content:center}
  .ob-step .mark .ok{color:var(--done); font-weight:800; font-size:16px}
  .spin{width:15px; height:15px; border:2.5px solid var(--line); border-top-color:var(--blue); border-radius:50%; animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }

  /* ── финал узла ── */
  .finale{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:0 24px}
  .finale .big{font-size:52px}
  .finale h2{font-size:21px}
  .finale .xp{background:#EAF4FE; color:var(--blue-deep); font-weight:800; border-radius:99px; padding:6px 16px}
  .finale .ready{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--done); font-weight:800;
    background:#EAF9F1; border-radius:12px; padding:8px 14px; margin-top:6px}
  .finale p.small{color:var(--muted); font-size:13px}

  .toast{position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:12px; font-size:13.5px; font-weight:700; opacity:0; transition:.3s; z-index:40; pointer-events:none; white-space:nowrap}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* словарь-шторка (демо фикса) */
  .sheet{position:absolute; inset:0; background:rgba(34,48,63,.4); display:none; align-items:flex-end; z-index:30}
  .sheet.open{display:flex}
  .sheet-card{background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:16px 18px 24px; max-height:70%; overflow:auto}
  .sheet-card input{width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; margin:10px 0}
  .dict-row{padding:9px 2px; border-bottom:1px solid var(--line)}
  .dict-row b{font-size:18px} .dict-row .py{color:var(--blue-deep); font-weight:700; margin-left:8px; font-size:13px}
  .dict-row p{color:var(--muted); font-size:13px}

}

let hf = 312;
const zhVoice = () =&gt; speechSynthesis.getVoices().find(v=&gt;v.lang &amp;&amp; v.lang.toLowerCase().startsWith(&#x27;zh&#x27;));
function say(text, btn){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang=&#x27;zh-CN&#x27;; u.rate=.9;
    const v = zhVoice(); if(v) u.voice=v;
    if(btn){ btn.classList.add(&#x27;playing&#x27;); u.onend=()=&gt;btn.classList.remove(&#x27;playing&#x27;);
      setTimeout(()=&gt;btn.classList.remove(&#x27;playing&#x27;), 4000); }

const offsets = [0,-76,-108,-76,0,76,108,76];

function renderPath(){
  const el = document.getElementById(&#x27;path&#x27;); el.innerHTML=&#x27;&#x27;;

    }

}
/* плавная кривая тропа через центры узлов (вместо пунктира) */
function drawTrail(){
  const scene=preview.querySelector(&#x27;.scene&#x27;); if(!scene) return;
  let svg=document.getElementById(&#x27;trail&#x27;);
  if(!svg){
    svg=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;svg&#x27;);
    svg.setAttribute(&#x27;id&#x27;,&#x27;trail&#x27;); svg.setAttribute(&#x27;class&#x27;,&#x27;trail&#x27;);
    scene.insertBefore(svg, document.getElementById(&#x27;path&#x27;));
  }
  const sr=scene.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${sr.width} ${sr.height}`);
  const pts=[...preview.querySelectorAll(&#x27;.path .node&#x27;)].map(b=&gt;{
    const r=b.getBoundingClientRect();
    return {x:r.left+r.width/2-sr.left, y:r.top+r.height/2-sr.top};
  });
  if(pts.length&lt;2){ svg.innerHTML=&#x27;&#x27;; return; }
  let d=`M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i&lt;pts.length;i++){
    const a=pts[i-1], b=pts[i], my=(a.y+b.y)/2;
    d+=` C ${a.x} ${my}, ${b.x} ${my}, ${b.x} ${b.y}`;
  }
  svg.innerHTML=`&lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;#D3E5F6&quot; stroke-width=&quot;12&quot; stroke-linecap=&quot;round&quot;/&gt;
    &lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;#FFFFFF&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot; opacity=&quot;.6&quot;/&gt;`;
}
window.addEventListener(&#x27;resize&#x27;,()=&gt;requestAnimationFrame(drawTrail));
/* энергия 气: вход в НОВЫЙ урок/скорость/историю −5⚡; повторение, чекпоинт, сундук и
   повтор пройденного урока — бесплатно (анти-бинж не наказывает закрепление) */
let energy = 20; const ENERGY_MAX = 25, ENERGY_COST = 5;
function updateQi(){ document.getElementById(&#x27;qi&#x27;).textContent = energy;
  const f=document.getElementById(&#x27;qi-fill&#x27;); if(f) f.style.width=(energy/ENERGY_MAX*100)+&#x27;%&#x27;;
  const s=document.getElementById(&#x27;qi-num&#x27;); if(s) s.textContent=`${energy}/${ENERGY_MAX}`; }
function spendEnergy(cost){
  if(cost&lt;=0) return true;
  if(energy&lt;cost){ openEnergy(true); return false; }
  energy-=cost; updateQi(); return true;
}
function tapNode(i){
  const n=NODES[i];
  if(n.status===&#x27;locked&#x27;){ toast(&#x27;Сначала пройди предыдущий узел&#x27;); return; }
  if(n.status===&#x27;done&#x27;){
    if(n.kind===&#x27;chest&#x27;){ toast(&#x27;Сундук уже открыт&#x27;); return; }
    if(n.kind===&#x27;speed&#x27;){ if(spendEnergy(ENERGY_COST)) openSpeed(); return; }
    toast(&#x27;Повтор — бесплатно и без XP (v1)&#x27;); openNode(n); return;
  }
  if(n.kind===&#x27;chest&#x27;){
    hf+=30; document.getElementById(&#x27;hf&#x27;).textContent=hf;
    n.status=&#x27;done&#x27;; const nx=NODES[i+1]; if(nx&amp;&amp;nx.status===&#x27;locked&#x27;) nx.status=&#x27;current&#x27;;

  }
  const cost = (n.kind===&#x27;lesson&#x27;||n.kind===&#x27;story&#x27;||n.kind===&#x27;speed&#x27;) ? ENERGY_COST : 0;
  if(!spendEnergy(cost)) return;
  openNode(n);
}
function openNode(n){
  if(n.kind===&#x27;lesson&#x27;||n.kind===&#x27;story&#x27;||n.kind===&#x27;review&#x27;) startLesson(n);

    .sort(()=&gt;Math.random()-.5); // случайный порядок: лексика и грамматика вперемешку

  const items=[]; for(let k=0;k&lt;PAIRS.length;k++){ items.push(zh[k], ru[k]); } // grid 2 колонки: zh | ru
  document.getElementById(&#x27;pairs&#x27;).innerHTML=items.map((it,k)=&gt;
    `&lt;button class=&quot;pair${it.side===0?&#x27; zh&#x27;:&#x27;&#x27;}&quot; id=&quot;p${k}&quot; data-id=&quot;${it.id}&quot; data-side=&quot;${it.side}&quot; onclick=&quot;tapPair(${k},${it.side===0?`&#x27;${it.txt}&#x27;`:&#x27;null&#x27;})&quot;&gt;${it.side===0?&#x27;🔊 &#x27;:&#x27;&#x27;}${it.txt}&lt;/button&gt;`).join(&#x27;&#x27;);
  clearInterval(tint);
  document.getElementById(&#x27;speed-timer&#x27;).textContent=&#x27;0:30&#x27;;
  tint=setInterval(()=&gt;{ tleft--; document.getElementById(&#x27;speed-timer&#x27;).textContent=&#x27;0:&#x27;+String(Math.max(tleft,0)).padStart(2,&#x27;0&#x27;);
    if(tleft&lt;=0){ clearInterval(tint); speedEnd(false); } },1000);
}
function tapPair(k, zh){
  const el=document.getElementById(&#x27;p&#x27;+k);
  if(el.classList.contains(&#x27;gone&#x27;)) return;
  if(zh) say(zh);
  if(sel===null){ sel=k; el.classList.add(&#x27;sel&#x27;); return; }
  if(sel===k){ el.classList.remove(&#x27;sel&#x27;); sel=null; return; }
  const a=document.getElementById(&#x27;p&#x27;+sel);
  if(a.dataset.id===el.dataset.id &amp;&amp; a.dataset.side!==el.dataset.side){
    a.classList.remove(&#x27;sel&#x27;); a.classList.add(&#x27;gone&#x27;); el.classList.add(&#x27;gone&#x27;);
    matched++; document.getElementById(&#x27;speed-fill&#x27;).style.width=(matched/PAIRS.length*100)+&#x27;%&#x27;;
    if(matched===PAIRS.length){ clearInterval(tint); speedEnd(true); }
  }else{
    a.classList.remove(&#x27;sel&#x27;); a.classList.add(&#x27;shake&#x27;); el.classList.add(&#x27;shake&#x27;);
    setTimeout(()=&gt;{a.classList.remove(&#x27;shake&#x27;);el.classList.remove(&#x27;shake&#x27;);},350);
  }
  sel=null;
}
function speedEnd(win){
  document.getElementById(&#x27;speed-res&#x27;).textContent = win?`4/4 за ${30-tleft} сек · +6 汉 (кап 3 раунда/день)`:&#x27;Время вышло — попробуй ещё&#x27;;
  document.getElementById(&#x27;speed-verdict&#x27;).classList.add(&#x27;show&#x27;);
  document.getElementById(&#x27;speed-done&#x27;).style.display=&#x27;block&#x27;;
  if(win) hf+=6;
}

/* ── чекпоинт ── */
const CP=[
  {q:&#x27;«Старший брат» — это…&#x27;, opts:[[&#x27;哥哥 gēge&#x27;,true],[&#x27;弟弟 dìdi&#x27;,false],[&#x27;叔叔 shūshu&#x27;,false],[&#x27;爷爷 yéye&#x27;,false]]},
  {q:&#x27;Выбери перевод: 我爱我的家&#x27;, opts:[[&#x27;Я люблю свою семью&#x27;,true],[&#x27;У меня большая семья&#x27;,false],[&#x27;Моя семья дома&#x27;,false],[&#x27;Я иду домой&#x27;,false]]},
];
let cpStep=0, cpRight=0;
function openCheckpoint(){
  cpStep=0; cpRight=0;
  document.getElementById(&#x27;checkpoint&#x27;).classList.add(&#x27;open&#x27;);
  renderCp();
}
function renderCp(){
  const q=CP[cpStep];
  document.getElementById(&#x27;cp-step&#x27;).textContent=(cpStep+1)+&#x27;/2&#x27;;
  document.getElementById(&#x27;cp-fill&#x27;).style.width=(cpStep/CP.length*100)+&#x27;%&#x27;;
  document.getElementById(&#x27;cp-body&#x27;).innerHTML=
    `&lt;p class=&quot;ex-prompt&quot;&gt;${q.q}&lt;/p&gt;
     &lt;div class=&quot;opts&quot;&gt;${q.opts.map((o,i)=&gt;`&lt;button class=&quot;opt&quot; onclick=&quot;cpPick(${i})&quot;&gt;${o[0]}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
}
function cpPick(i){
  if(CP[cpStep].opts[i][1]) cpRight++;
  preview.querySelectorAll(&#x27;#cp-body .opt&#x27;).forEach((el,j)=&gt;{
    el.disabled=true;
    if(CP[cpStep].opts[j][1]) el.classList.add(&#x27;right&#x27;); else if(j===i) el.classList.add(&#x27;wrong&#x27;);
  });
  setTimeout(()=&gt;{ cpStep++;
    if(cpStep&lt;CP.length) renderCp();
    else { const pass=cpRight/CP.length&gt;=.8; hf+= pass?25:5; finishNode(&#x27;checkpoint&#x27;, pass, Math.round(cpRight/CP.length*100)); }
  },800);
}

/* ── завершение узла ── */
function finishNode(kind, pass=true, score=null){
  [&#x27;lesson&#x27;,&#x27;speed&#x27;,&#x27;checkpoint&#x27;].forEach(closeOverlay);
  const i=NODES.findIndex(n=&gt;n.status===&#x27;current&#x27;);
  const isReplay = i&lt;0 || (kind===&#x27;speed&#x27; &amp;&amp; NODES[i].kind!==&#x27;speed&#x27;);
  let title=&#x27;Урок пройден!&#x27;, big=&#x27;🎉&#x27;, xpTxt=`+${LESSON_SIZE} 汉分`, readyTxt=&#x27;Следующий узел уже готов — предгенерация N+1&#x27;;
  if(kind===&#x27;review&#x27;){ title=&#x27;Повторение пройдено!&#x27;; big=&#x27;🔄&#x27;; xpTxt=&#x27;+3 汉分&#x27;; readyTxt=&#x27;FSRS обновлён — интервалы слов пересчитаны&#x27;; }
  if(kind===&#x27;speed&#x27;){ title=&#x27;Раунд «Скорости» сыгран!&#x27;; big=&#x27;⚡&#x27;; xpTxt=&#x27;+6 汉分&#x27;; }
  if(kind===&#x27;checkpoint&#x27;){
    big = pass?&#x27;🏆&#x27;:&#x27;😮‍💨&#x27;;
    title = pass?`Чекпоинт сдан: ${score}%`:`Пока ${score}% — нужно ≥80%`;
    xpTxt = pass?&#x27;+25 汉分&#x27;:&#x27;+5 汉分 за попытку&#x27;;
    readyTxt = pass?&#x27;Модуль «Семья» закрыт — открыт m1-5 «Счёт и числа»&#x27;:&#x27;Повтори слабые места и вернись&#x27;;
  }
  if(!isReplay &amp;&amp; pass &amp;&amp; i&gt;=0){
    NODES[i].status=&#x27;done&#x27;;
    if(i+1&lt;NODES.length) NODES[i+1].status=&#x27;current&#x27;;
  }
  document.getElementById(&#x27;hf&#x27;).textContent=hf;
  document.getElementById(&#x27;finale-body&#x27;).innerHTML=
    `&lt;span class=&quot;big&quot;&gt;${big}&lt;/span&gt;&lt;h2&gt;${title}&lt;/h2&gt;
     &lt;span class=&quot;xp&quot;&gt;${xpTxt} · всего ${hf}&lt;/span&gt;
     &lt;span class=&quot;ready&quot;&gt;⚡ ${readyTxt}&lt;/span&gt;
     &lt;p class=&quot;small&quot;&gt;Открытие следующего узла — мгновенное: попытка и аудио сгенерированы фоном заранее.&lt;/p&gt;
     &lt;button class=&quot;cta primary&quot; style=&quot;max-width:260px&quot; onclick=&quot;closeOverlay(&#x27;finale&#x27;);renderPath()&quot;&gt;К пути&lt;/button&gt;`;
  document.getElementById(&#x27;finale&#x27;).classList.add(&#x27;open&#x27;);
}

  let html=&#x27;&lt;span class=&quot;wd&quot;&gt;Пн&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Вт&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Ср&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Чт&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Пт&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Сб&lt;/span&gt;&lt;span class=&quot;wd&quot;&gt;Вс&lt;/span&gt;&#x27;;

  g.innerHTML=html;
})();

/* ветки обучения: знаешь уровень n → идёшь путь n→n+1 */
const OB_LEVELS=[
  [&#x27;🆕&#x27;,&#x27;С нуля&#x27;,&#x27;путь 0 → HSK 1&#x27;],
  [&#x27;📗&#x27;,&#x27;Знаю HSK 1&#x27;,&#x27;путь HSK 1 → HSK 2&#x27;],
  [&#x27;📘&#x27;,&#x27;Знаю HSK 2&#x27;,&#x27;путь HSK 2 → HSK 3&#x27;],
  [&#x27;📙&#x27;,&#x27;Знаю HSK 3&#x27;,&#x27;путь HSK 3 → HSK 4&#x27;],
  [&#x27;📕&#x27;,&#x27;Знаю HSK 4&#x27;,&#x27;путь HSK 4 → HSK 5&#x27;],
  [&#x27;📚&#x27;,&#x27;Знаю HSK 5&#x27;,&#x27;путь HSK 5 → HSK 6&#x27;],
];
const OB_BRANCHES=[&#x27;0 → HSK 1&#x27;,&#x27;HSK 1 → HSK 2&#x27;,&#x27;HSK 2 → HSK 3&#x27;,&#x27;HSK 3 → HSK 4&#x27;,&#x27;HSK 4 → HSK 5&#x27;,&#x27;HSK 5 → HSK 6&#x27;];
let ob={step:0, goal:null, mins:null, level:null};
function startOnboarding(){ ob={step:0,goal:null,mins:null,level:null}; document.getElementById(&#x27;onboarding&#x27;).classList.add(&#x27;open&#x27;); renderOb(); }
function obBack(){ if(ob.step&lt;=0){ closeOverlay(&#x27;onboarding&#x27;); return; } ob.step--; renderOb(); }
function obPick(key,i){ ob[key]=i; ob.step++; renderOb(); }
function obOptions(list,key){
  return &#x27;&lt;div class=&quot;opts&quot;&gt;&#x27;+list.map((o,i)=&gt;
    `&lt;button class=&quot;opt&quot; onclick=&quot;obPick(&#x27;${key}&#x27;,${i})&quot;&gt;&lt;span&gt;&lt;span class=&quot;oi&quot;&gt;${o[0]}&lt;/span&gt;${o[1]}&lt;/span&gt;${o[2]?`&lt;small&gt;${o[2]}&lt;/small&gt;`:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
}
function renderOb(){
  const b=document.getElementById(&#x27;ob-body&#x27;);
  const total=6;
  document.getElementById(&#x27;ob-fill&#x27;).style.width=(ob.step/total*100)+&#x27;%&#x27;;
  document.getElementById(&#x27;ob-back&#x27;).textContent = ob.step===0 ? &#x27;✕&#x27; : &#x27;‹&#x27;;
  if(ob.step===0){
    b.innerHTML=`&lt;div class=&quot;ob-hero&quot;&gt;
        &lt;div class=&quot;ob-ava&quot; style=&quot;overflow:hidden;background:#F3F6FA&quot;&gt;&lt;img src=&quot;${SHIFU_AVA}&quot; alt=&quot;&quot; style=&quot;width:100%;height:100%;object-fit:cover&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;ob-title&quot;&gt;你好! Я Шифу 师傅&lt;/p&gt;
        &lt;p class=&quot;ob-sub&quot;&gt;Проведу тебя по пути китайского — от первых слов до HSK 6. Голосом, с играми и без зубрёжки.&lt;/p&gt;
      &lt;/div&gt;
      &lt;button class=&quot;cta primary&quot; onclick=&quot;ob.step=1;renderOb()&quot;&gt;Начать&lt;/button&gt;`;
  }else if(ob.step===1){
    b.innerHTML=`&lt;p class=&quot;ob-q&quot;&gt;Зачем тебе китайский?&lt;/p&gt;&lt;p class=&quot;ob-hint&quot;&gt;Шифу подстроит примеры и темы под твою цель&lt;/p&gt;`+obOptions(OB_GOALS,&#x27;goal&#x27;);
  }else if(ob.step===2){
    b.innerHTML=`&lt;p class=&quot;ob-q&quot;&gt;Сколько времени готов заниматься?&lt;/p&gt;&lt;p class=&quot;ob-hint&quot;&gt;Один узел пути — как раз 3–5 минут&lt;/p&gt;`+obOptions(OB_MINS,&#x27;mins&#x27;);
  }else if(ob.step===3){
    b.innerHTML=`&lt;p class=&quot;ob-q&quot;&gt;Твой уровень китайского?&lt;/p&gt;&lt;p class=&quot;ob-hint&quot;&gt;Точность не критична — путь подстроится по чекпоинтам&lt;/p&gt;`+obOptions(OB_LEVELS,&#x27;level&#x27;);
  }else if(ob.step===4){
    if(ob.level===0){ ob.step=5; renderOb(); return; } // с нуля — тест не нужен
    b.innerHTML=`&lt;div class=&quot;ob-hero&quot;&gt;
        &lt;div class=&quot;ob-ava&quot; style=&quot;overflow:hidden;background:#F3F6FA&quot;&gt;&lt;img src=&quot;${SHIFU_AVA}&quot; alt=&quot;&quot; style=&quot;width:100%;height:100%;object-fit:cover&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;ob-title&quot;&gt;Проверим уровень голосом&lt;/p&gt;
        &lt;p class=&quot;ob-sub&quot;&gt;2 минуты разговора с Шифу в чате — и он точно определит, откуда стартовать. Это надёжнее самооценки.&lt;/p&gt;
      &lt;/div&gt;
      &lt;button class=&quot;cta primary&quot; onclick=&quot;toast(&#x27;webApp.close() → голосовой мини-тест в чате → level_verified&#x27;);ob.step=5;renderOb()&quot;&gt;🎤 Пройти тест в чате&lt;/button&gt;`;
  }else if(ob.step===5){
    const lvl = &#x27;ветка &#x27; + OB_BRANCHES[ob.level||0];
    b.innerHTML=`&lt;p class=&quot;ob-q&quot; style=&quot;text-align:center;margin-top:14px&quot;&gt;Готовим твой путь…&lt;/p&gt;
      &lt;p class=&quot;ob-hint&quot; style=&quot;text-align:center&quot;&gt;${lvl} · цель: ${OB_GOALS[ob.goal?ob.goal:0][1].toLowerCase()}&lt;/p&gt;
      &lt;div class=&quot;ob-steps&quot;&gt;
        &lt;div class=&quot;ob-step&quot; id=&quot;obs-0&quot;&gt;&lt;span class=&quot;mark&quot;&gt;&lt;span class=&quot;spin&quot;&gt;&lt;/span&gt;&lt;/span&gt;Подбираем слова под твой уровень&lt;/div&gt;
        &lt;div class=&quot;ob-step&quot; id=&quot;obs-1&quot;&gt;&lt;span class=&quot;mark&quot;&gt;&lt;/span&gt;Собираем первые уроки&lt;/div&gt;
        &lt;div class=&quot;ob-step&quot; id=&quot;obs-2&quot;&gt;&lt;span class=&quot;mark&quot;&gt;&lt;/span&gt;Озвучиваем упражнения&lt;/div&gt;
      &lt;/div&gt;`;
    // предгенерация на глазах: упражнения + TTS первых двух узлов уже готовы к моменту входа
    [0,1,2].forEach(i=&gt;setTimeout(()=&gt;{
      const row=document.getElementById(&#x27;obs-&#x27;+i); if(!row) return;
      row.classList.add(&#x27;done&#x27;); row.querySelector(&#x27;.mark&#x27;).innerHTML=&#x27;&lt;span class=&quot;ok&quot;&gt;✓&lt;/span&gt;&#x27;;
      const nx=document.getElementById(&#x27;obs-&#x27;+(i+1));
      if(nx) nx.querySelector(&#x27;.mark&#x27;).innerHTML=&#x27;&lt;span class=&quot;spin&quot;&gt;&lt;/span&gt;&#x27;;
      else { ob.step=6; setTimeout(renderOb,400); }
    }, 900*(i+1)));
  }else{
    b.innerHTML=`&lt;div class=&quot;ob-hero&quot;&gt;
        &lt;div class=&quot;ob-ava&quot;&gt;🏔&lt;/div&gt;
        &lt;p class=&quot;ob-title&quot;&gt;Путь готов!&lt;/p&gt;
        &lt;p class=&quot;ob-sub&quot;&gt;Первые уроки уже ждут — открываются мгновенно. Занимайся ${OB_MINS[ob.mins?ob.mins:1][1].toLowerCase()}, и стрик 🔥 сделает остальное.&lt;/p&gt;
      &lt;/div&gt;
      &lt;button class=&quot;cta primary&quot; onclick=&quot;closeOverlay(&#x27;onboarding&#x27;);showTab(&#x27;home&#x27;);toast(&#x27;Placement: тропа стартовала, первые 2 узла предгенерированы ⚡&#x27;)&quot;&gt;В путь 🏔&lt;/button&gt;`;
  }
}

/* ── фото профиля: статичное (localStorage + try/catch), ракурс = перетаскивание, масштаб = слайдер ──
   В проде хранится на бэкенде (upload → /api/me/avatar), НЕ в браузере — поэтому и не пропадает. */
let ava = null; // {src,w,h,x,y,s}
function loadAva(){
  try{ const raw=localStorage.getItem(&#x27;shifu_avatar&#x27;); if(raw) ava=JSON.parse(raw); }catch(e){}
  renderAva();
}
function avaTransform(el, box){
